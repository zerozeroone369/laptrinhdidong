plugins {
    alias(libs.plugins.android.application)
}

def localProps = new Properties()
def localPropsFile = rootProject.file("local.properties")
if (localPropsFile.exists()) {
    localPropsFile.withInputStream { localProps.load(it) }
}
def geminiKey = localProps.getProperty("GEMINI_API_KEY", "").replace("\"", "\\\"")

android {
    namespace 'com.example.tieuluanck'
    compileSdk {
        version = release(37)
    }

    defaultConfig {
        applicationId "com.example.tieuluanck"
        minSdk 24
        targetSdk 37
        versionCode 3
        versionName "3.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        buildConfigField "String", "GEMINI_API_KEY", "\"${geminiKey}\""

        javaCompileOptions {
            annotationProcessorOptions {
                arguments += [
                        "room.schemaLocation": "$projectDir/schemas".toString(),
                        "room.incremental"   : "true"
                ]
            }
        }
    }

    buildFeatures {
        viewBinding true
        buildConfig true
    }

    buildTypes {
        release {
            optimization {
                enable false
            }
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
}

dependencies {
    implementation libs.activity.ktx
    implementation libs.appcompat
    implementation libs.constraintlayout
    implementation libs.coordinatorlayout
    implementation libs.material
    implementation libs.recyclerview
    implementation libs.viewpager2
    implementation libs.fragment
    implementation libs.swiperefreshlayout

    implementation libs.lifecycle.viewmodel
    implementation libs.lifecycle.livedata
    implementation libs.lifecycle.runtime

    implementation libs.room.runtime
    annotationProcessor libs.room.compiler

    implementation libs.glide
    implementation libs.gson
    implementation libs.work.runtime
    implementation libs.okhttp

    // CameraX & ML Kit Barcode (ISBN Scanner) & Text Recognition (OCR)
    implementation libs.camera.camera2
    implementation libs.camera.lifecycle
    implementation libs.camera.view
    implementation libs.mlkit.barcode
    implementation libs.mlkit.text.recognition

    // Firebase Cloud Sync / Auth / Storage / FCM (safe runtime guard when google-services.json not yet present)
    implementation platform(libs.firebase.bom)
    implementation libs.firebase.auth
    implementation libs.firebase.firestore
    implementation libs.firebase.storage
    implementation libs.firebase.messaging
    implementation libs.play.services.auth

    testImplementation libs.junit
    testImplementation libs.room.testing
    androidTestImplementation libs.espresso.core
    androidTestImplementation libs.ext.junit
}
